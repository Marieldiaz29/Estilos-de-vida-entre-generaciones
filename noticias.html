<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias climáticas del día</title>
<style>
:root{--verde:#1f6b4a;--verde-osc:#134733;--hoja:#e6f2e8;--cielo:#dff1f5;--tierra:#7a5c3a;--texto:#1c2b24;--borde:#b9d4c2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--texto);line-height:1.6;
background:linear-gradient(180deg,var(--cielo) 0%,var(--hoja) 55%,#f4f9f4 100%);min-height:100vh}
header{background:var(--verde-osc);color:#fff;padding:36px 18px 30px;text-align:center;border-bottom:6px solid #6bbf8a}
header h1{margin:0 0 10px;font-size:clamp(1.7rem,6vw,2.6rem)}
header p{margin:0 auto;max-width:620px;opacity:.92}
main{max-width:760px;margin:0 auto;padding:26px 16px 50px}
.panel{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:20px;box-shadow:0 4px 14px rgba(19,71,51,.08)}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.campo{flex:1 1 240px;display:flex;flex-direction:column;gap:6px}
label{font-weight:600;color:var(--verde-osc)}
select{font:inherit;padding:11px 12px;border:2px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto);width:100%}
select:focus,button:focus-visible{outline:3px solid #6bbf8a;outline-offset:2px}
button{font:inherit;font-weight:700;padding:12px 22px;border:0;border-radius:10px;background:var(--verde);color:#fff;cursor:pointer;flex:0 0 auto}
button:hover:not(:disabled){background:var(--verde-osc)}
button:disabled{opacity:.55;cursor:not-allowed}
#estado{margin:16px 0 0;min-height:1.5em;font-weight:600;color:var(--tierra)}
#estado.error{color:#a32a2a}
#resultados{margin-top:20px}
#resultados h2{font-size:1.2rem;color:var(--verde-osc);margin:0 0 10px}
#resultados h2 span{font-weight:400;color:var(--tierra);font-size:.95rem;display:block}
#caja{white-space:pre-line;background:#fff;border:2px solid var(--verde);border-left-width:8px;border-radius:12px;padding:18px;overflow-wrap:anywhere}
#caja a{color:#0b5d8a;font-weight:600}
@media (max-width:480px){button{width:100%}}
</style>
</head>
<body>
<header>
<h1>Noticias climáticas del día</h1>
<p>Esta página muestra un resumen de las noticias ambientales más recientes, explicado por inteligencia artificial.</p>
</header>
<main>
<div class="panel">
<div class="fila">
<div class="campo">
<label for="tema">Tema</label>
<select id="tema">
<option>Cambio climático</option>
<option>Energías renovables</option>
<option>Contaminación del aire</option>
<option>Agua y sequías</option>
<option>Biodiversidad y ecosistemas</option>
<option>Residuos y reciclaje</option>
</select>
</div>
<button id="btn" type="button">Ver noticias</button>
</div>
<p id="estado" role="status" aria-live="polite"></p>
</div>
<section id="resultados" hidden>
<h2>Noticias de hoy <span id="fecha"></span></h2>
<div id="caja"></div>
</section>
</main>
<script>
// Pega aquí la URL de tu webhook de Make (entre las comillas):
const WEBHOOK_URL = "https://hook.eu1.make.com/73if7jp9oksmbgc659wh6vl8may2auim";

const btn = document.getElementById("btn");
const tema = document.getElementById("tema");
const estado = document.getElementById("estado");
const resultados = document.getElementById("resultados");
const caja = document.getElementById("caja");

function fechaHoy() {
  return new Date().toLocaleDateString("es-MX", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

// Muestra el texto plano; las líneas que empiezan con http se vuelven enlaces
function mostrar(texto) {
  caja.textContent = "";
  texto.split("\n").forEach(function (linea, i, todas) {
    const limpia = linea.trim();
    if (/^https?:\/\//i.test(limpia)) {
      const a = document.createElement("a");
      a.href = limpia;
      a.textContent = limpia;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      caja.appendChild(a);
    } else {
      caja.appendChild(document.createTextNode(linea));
    }
    if (i < todas.length - 1) caja.appendChild(document.createTextNode("\n"));
  });
}

btn.addEventListener("click", function () {
  estado.className = "";
  estado.textContent = "Buscando y resumiendo noticias...";
  btn.disabled = true;
  resultados.hidden = true;

  const datos = new URLSearchParams();
  datos.append("tema", tema.value);

  fetch(WEBHOOK_URL, { method: "POST", body: datos })
    .then(function (r) {
      if (!r.ok) throw new Error("Error " + r.status);
      return r.text();
    })
    .then(function (texto) {
      mostrar(texto);
      document.getElementById("fecha").textContent = fechaHoy();
      resultados.hidden = false;
      estado.textContent = "";
    })
    .catch(function () {
      estado.className = "error";
      estado.textContent = "No se pudieron obtener las noticias, intenta de nuevo.";
    })
    .then(function () {
      btn.disabled = false;
    });
});
</script>
</body>
</html>
